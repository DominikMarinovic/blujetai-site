<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&amp;display=swap');
    </style>
  </defs>
  
  <!-- Rounded Background (Pill Shape) -->
  <!-- rx="50" makes the corners fully round based on height of 100 -->
  <rect width="100%" height="100%" rx="50" fill="#102C45" />

  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" 
        font-family="'Playfair Display', 'Times New Roman', serif" 
        font-style="italic" 
        font-size="60" 
        fill="#fafafa"
	px="4"
	py="1"
        letter-spacing="1">
    Blujet AI
  </text>
</svg>